name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Release build without warnings
        run: swift build -c release 2>&1 | tee build.log && ! grep -q "warning:" build.log
